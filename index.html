<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM PCP - Project Manager System</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- PDF.js (Leitor de TAP) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    body, html { margin: 0; padding: 0; font-family: sans-serif; }
    #root { height: 100vh; width: 100%; display: flex; flex-direction: column; }
    @media print {
      .no-print { display: none !important; }
      body { background-color: white; }
      .print-container { width: 100%; margin: 0; padding: 0; height: auto !important; overflow: visible !important; }
      textarea { border: none !important; resize: none; background: white !important; }
      @page { margin: 1cm; size: landscape; }
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">

  <div id="root"></div>

  <script type="text/babel">
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const { useState, useMemo, useRef } = React;

    // Ícones integrados (não precisa de npm)
    const IconHome = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
    const IconLayout = ({className="w-5 h-5"}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="9" y1="21" y2="9"/></svg>;
    const IconListTree = ({className="w-5 h-5"}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12h-8"/><path d="M21 6H8"/><path d="M21 18h-8"/><path d="M12 12v6"/><path d="M3 6v12c0 1.1.9 2 2 2h3"/></svg>;
    const IconBarChart = ({className="w-5 h-5"}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 3v18h18"/><path d="M7 16h8"/><path d="M7 11h12"/><path d="M7 6h4"/></svg>;
    const IconPrinter = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>;
    const IconSave = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>;
    const IconEdit = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
    const IconPlus = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>;
    const IconTrash = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
    const IconUpload = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>;

    const initialCanvasData = {
      projectName: "Implantação de Cabine de Pintura Eletrostática",
      justificativa: "Internalizar a pintura para reduzir custos e lead time.",
      objetivo: "Instalar cabine de pintura eletrostática (400 peças/dia) em 6 meses, orçamento R$ 380k.",
      beneficios: "Redução de custos, maior qualidade.",
      produto: "Cabine instalada e operacional.",
      requisitos: "Atender NR-10 e NR-12, 400 peças/dia.",
      escopo: "Compra, adequação civil/elétrica, instalação, testes.",
      entregaveis: "Layout, Infraestrutura, Equipamento instalado, Treinamento.",
      stakeholders: "Diretoria, Gerência, Manutenção, Fornecedor.",
      equipe: "Gerente de Projeto, Eng. Eletricista, Téc. Segurança.",
      premissas: "Disponibilidade de área na fábrica e profissionais.",
      restricoes: "Orçamento de 380k, prazo máximo 6 meses.",
      cronograma: "6 meses.",
      orcamento: "R$ 380.000,00."
    };

    const initialEapText = `1. Implantação de Cabine de Pintura\n  1.1. Planejamento\n    1.1.1. Especificação Técnica\n    1.1.2. Orçamentos\n  1.2. Execução\n    1.2.1. Preparação do Local\n    1.2.2. Instalação Elétrica\n    1.2.3. Montagem da Cabine\n  1.3. Encerramento\n    1.3.1. Testes de Operação\n    1.3.2. Treinamento`;

    const initialGanttTasks = [
      { id: 1, name: "Planejamento e Especificação", start: "2026-01-01", end: "2026-01-15", status: "concluido", resp: "Eng. Produção" },
      { id: 2, name: "Contratação de Fornecedores", start: "2026-01-16", end: "2026-02-15", status: "em_andamento", resp: "Suprimentos" },
      { id: 3, name: "Preparação do Local", start: "2026-02-01", end: "2026-02-28", status: "em_andamento", resp: "Manutenção" },
      { id: 4, name: "Instalação da Cabine", start: "2026-03-01", end: "2026-04-30", status: "pendente", resp: "Fornecedor" }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [canvasData, setCanvasData] = useState(initialCanvasData);
      const [eapText, setEapText] = useState(initialEapText);
      const [ganttTasks, setGanttTasks] = useState(initialGanttTasks);

      return (
        <div className="flex h-screen bg-gray-100 font-sans text-gray-800">
          <aside className="w-64 bg-slate-900 text-white flex flex-col no-print shrink-0">
            <div className="p-6 border-b border-slate-800">
              <h1 className="text-xl font-bold flex items-center gap-2">
                <IconLayout className="w-6 h-6 text-blue-400" /> PM PCP
              </h1>
              <p className="text-xs text-slate-400 mt-1">Project Manager System</p>
            </div>
            <nav className="flex-1 p-4 space-y-2">
              <NavItem active={activeTab === 'home'} onClick={() => setActiveTab('home')} icon={<IconHome/>} label="Dashboard" />
              <NavItem active={activeTab === 'canvas'} onClick={() => setActiveTab('canvas')} icon={<IconLayout/>} label="1. Canvas Project" />
              <NavItem active={activeTab === 'eap'} onClick={() => setActiveTab('eap')} icon={<IconListTree/>} label="2. WBS / EAP" />
              <NavItem active={activeTab === 'gantt'} onClick={() => setActiveTab('gantt')} icon={<IconBarChart/>} label="3. Gráfico de Gantt" />
            </nav>
            <div className="p-4 border-t border-slate-800 text-xs text-slate-500 text-center">PCP - Eng. de Produção</div>
          </aside>

          <main className="flex-1 flex flex-col h-full overflow-hidden print-container">
            <header className="bg-white h-16 border-b border-gray-200 flex items-center justify-between px-6 no-print shrink-0">
              <h2 className="text-lg font-semibold text-slate-800">
                {activeTab === 'home' && 'Visão Geral do Sistema'}
                {activeTab === 'canvas' && 'Módulo 1: Project Canvas'}
                {activeTab === 'eap' && 'Módulo 2: Estrutura Analítica do Projeto (EAP)'}
                {activeTab === 'gantt' && 'Módulo 3: Cronograma e Gantt'}
              </h2>
              <div className="flex items-center gap-4">
                <span className="text-sm font-medium text-blue-700 bg-blue-50 px-3 py-1 rounded-full border border-blue-100">
                  Projeto: {canvasData.projectName || 'Não definido'}
                </span>
                {activeTab !== 'home' && (
                  <button onClick={() => window.print()} className="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-md text-sm font-medium">
                    <IconPrinter /> Exportar PDF
                  </button>
                )}
              </div>
            </header>

            <div className="flex-1 overflow-auto p-6">
              {activeTab === 'home' && <HomeView setTab={setActiveTab} project={canvasData} />}
              {activeTab === 'canvas' && <CanvasView data={canvasData} setData={setCanvasData} />}
              {activeTab === 'eap' && <EapView text={eapText} setText={setEapText} projectName={canvasData.projectName} />}
              {activeTab === 'gantt' && <GanttView tasks={ganttTasks} setTasks={setGanttTasks} />}
            </div>
          </main>
        </div>
      );
    }

    function NavItem({ active, onClick, icon, label }) {
      return (
        <button onClick={onClick} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors ${active ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>
          {icon} {label}
        </button>
      );
    }

    function HomeView({ setTab, project }) {
      return (
        <div className="max-w-5xl mx-auto space-y-6">
          <div className="bg-white p-8 rounded-xl border border-gray-200 shadow-sm">
            <h2 className="text-3xl font-bold text-slate-800 mb-2">Bem-vindo ao Project Manager PCP</h2>
            <p className="text-slate-600 mb-6">Plataforma integrada para planejamento e controle de projetos industriais.</p>
            <div className="bg-blue-50 border-l-4 border-blue-600 p-4 rounded-r-lg mb-8">
              <h3 className="font-semibold text-blue-900">Projeto em Andamento:</h3>
              <p className="text-blue-800 text-lg">{project.projectName || "Nenhum projeto definido"}</p>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              <DashboardCard title="1. Canvas Project" desc="Crie a declaração de escopo e importe dados via PDF do TAP." icon={<IconLayout className="w-8 h-8 text-blue-600" />} onClick={() => setTab('canvas')} />
              <DashboardCard title="2. EAP (WBS)" desc="Estruture as entregas do projeto hierarquicamente." icon={<IconListTree className="w-8 h-8 text-emerald-600" />} onClick={() => setTab('eap')} />
              <DashboardCard title="3. Gráfico de Gantt" desc="Gerencie o cronograma e acompanhe o status." icon={<IconBarChart className="w-8 h-8 text-purple-600" />} onClick={() => setTab('gantt')} />
            </div>
          </div>
        </div>
      );
    }

    function DashboardCard({ title, desc, icon, onClick }) {
      return (
        <div onClick={onClick} className="bg-white border border-gray-200 p-6 rounded-xl shadow-sm hover:shadow-md hover:border-blue-300 transition-all cursor-pointer">
          <div className="mb-4 p-3 bg-gray-50 rounded-lg inline-block">{icon}</div>
          <h3 className="text-lg font-bold text-slate-800 mb-2">{title}</h3>
          <p className="text-sm text-slate-600">{desc}</p>
        </div>
      );
    }

    function CanvasView({ data, setData }) {
      const [isEditing, setIsEditing] = useState(false);
      const [isLoadingPdf, setIsLoadingPdf] = useState(false);
      const fileInputRef = useRef(null);

      const handleChange = (field, value) => setData(prev => ({ ...prev, [field]: value }));

      const handleFileUpload = async (event) => {
        const file = event.target.files[0];
        if (!file || file.type !== "application/pdf") return;
        setIsLoadingPdf(true);
        try {
          const reader = new FileReader();
          reader.onload = async (e) => {
            const typedarray = new Uint8Array(e.target.result);
            const pdf = await window.pdfjsLib.getDocument(typedarray).promise;
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const textContent = await page.getTextContent();
              fullText += textContent.items.map(item => item.str).join(' ') + ' \n';
            }
            const extract = (regex) => {
              const match = fullText.match(regex);
              return match ? match[1].trim() : '';
            };
            setData(prev => ({
              ...prev,
              projectName: extract(/Nome do Projeto[\s\S]*?:\s*([\s\S]*?)(?=\n[A-Z][a-zÀ-ÿ]+:|$)/i) || prev.projectName,
              justificativa: extract(/Justificativa[\s\S]*?:\s*([\s\S]*?)(?=\n[A-Z][a-zÀ-ÿ]+:|$)/i) || prev.justificativa,
              objetivo: extract(/Objetivo[\s\S]*?:\s*([\s\S]*?)(?=\n[A-Z][a-zÀ-ÿ]+:|$)/i) || prev.objetivo,
              beneficios: extract(/Benefícios[\s\S]*?:\s*([\s\S]*?)(?=\n[A-Z][a-zÀ-ÿ]+:|$)/i) || prev.beneficios,
              produto: extract(/Produto[\s\S]*?:\s*([\s\S]*?)(?=\n[A-Z][a-zÀ-ÿ]+:|$)/i) || prev.produto,
              requisitos: extract(/Requisitos[\s\S]*?:\s*([\s\S]*?)(?=\n[A-Z][a-zÀ-ÿ]+:|$)/i) || prev.requisitos,
              premissas: extract(/Premissas[\s\S]*?:\s*([\s\S]*?)(?=\n[A-Z][a-zÀ-ÿ]+:|$)/i) || prev.premissas,
              restricoes: extract(/Restrições[\s\S]*?:\s*([\s\S]*?)(?=\n[A-Z][a-zÀ-ÿ]+:|$)/i) || prev.restricoes,
              escopo: extract(/Escopo[\s\S]*?:\s*([\s\S]*?)(?=\n[A-Z][a-zÀ-ÿ]+:|$)/i) || prev.escopo,
              entregaveis: extract(/Entregáveis[\s\S]*?:\s*([\s\S]*?)(?=\n[A-Z][a-zÀ-ÿ]+:|$)/i) || prev.entregaveis,
              stakeholders: extract(/Stakeholders[\s\S]*?:\s*([\s\S]*?)(?=\n[A-Z][a-zÀ-ÿ]+:|$)/i) || prev.stakeholders,
              equipe: extract(/Equipe[\s\S]*?:\s*([\s\S]*?)(?=\n[A-Z][a-zÀ-ÿ]+:|$)/i) || prev.equipe,
              cronograma: extract(/Cronograma[\s\S]*?:\s*([\s\S]*?)(?=\n[A-Z][a-zÀ-ÿ]+:|$)/i) || prev.cronograma,
              orcamento: extract(/Orçamento[\s\S]*?:\s*([\s\S]*?)(?=\n[A-Z][a-zÀ-ÿ]+:|$)/i) || prev.orcamento
            }));
            setIsLoadingPdf(false);
            if (fileInputRef.current) fileInputRef.current.value = '';
          };
          reader.readAsArrayBuffer(file);
        } catch {
          setIsLoadingPdf(false);
          alert("Falha na leitura do PDF.");
        }
      };

      return (
        <div className="max-w-7xl mx-auto flex flex-col h-full">
          <div className="flex justify-between items-center mb-6 no-print">
            <div>
              <h2 className="text-2xl font-bold text-slate-800">Project Model Canvas</h2>
              <p className="text-slate-500 text-sm">Estruture as informações ou faça upload do TAP para preencher.</p>
            </div>
            <div className="flex gap-2">
              <input type="file" accept="application/pdf" className="hidden" ref={fileInputRef} onChange={handleFileUpload} />
              <button onClick={() => fileInputRef.current?.click()} className="flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white" disabled={isLoadingPdf}>
                {isLoadingPdf ? "Lendo PDF..." : <><IconUpload/> Importar TAP (PDF)</>}
              </button>
              <button onClick={() => setIsEditing(!isEditing)} className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium text-white ${isEditing ? 'bg-emerald-600' : 'bg-blue-600'}`}>
                {isEditing ? <><IconSave/> Salvar</> : <><IconEdit/> Editar</>}
              </button>
            </div>
          </div>

          <div className="mb-4">
            <label className="block text-sm font-bold text-slate-700 mb-1">Nome do Projeto</label>
            {isEditing ? (
              <input type="text" className="w-full p-2 border border-gray-300 rounded" value={data.projectName} onChange={(e) => handleChange('projectName', e.target.value)} />
            ) : (
              <h1 className="text-2xl font-bold text-blue-900 border-b-2 border-blue-900 pb-2">{data.projectName || "Sem nome"}</h1>
            )}
          </div>

          <div className="flex-1 grid grid-cols-1 md:grid-cols-4 lg:grid-cols-5 gap-2 bg-slate-200 p-2 rounded-lg print:bg-white print:p-0">
            <div className="flex flex-col gap-2">
              <CanvasBlock title="Justificativa" field="justificativa" data={data} isEditing={isEditing} onChange={handleChange} bg="bg-blue-50" />
              <CanvasBlock title="Objetivo SMART" field="objetivo" data={data} isEditing={isEditing} onChange={handleChange} bg="bg-blue-50" />
              <CanvasBlock title="Benefícios Esperados" field="beneficios" data={data} isEditing={isEditing} onChange={handleChange} bg="bg-blue-50" />
            </div>
            <div className="flex flex-col gap-2">
              <CanvasBlock title="Produto / Resultado" field="produto" data={data} isEditing={isEditing} onChange={handleChange} bg="bg-emerald-50" />
              <CanvasBlock title="Requisitos Principais" field="requisitos" data={data} isEditing={isEditing} onChange={handleChange} bg="bg-emerald-50" />
              <CanvasBlock title="Escopo do Projeto" field="escopo" data={data} isEditing={isEditing} onChange={handleChange} bg="bg-emerald-50" />
            </div>
            <div className="flex flex-col gap-2">
              <CanvasBlock title="Stakeholders" field="stakeholders" data={data} isEditing={isEditing} onChange={handleChange} bg="bg-amber-50" />
              <CanvasBlock title="Equipe do Projeto" field="equipe" data={data} isEditing={isEditing} onChange={handleChange} bg="bg-amber-50" />
            </div>
            <div className="flex flex-col gap-2">
              <CanvasBlock title="Premissas" field="premissas" data={data} isEditing={isEditing} onChange={handleChange} bg="bg-purple-50" />
              <CanvasBlock title="Restrições" field="restricoes" data={data} isEditing={isEditing} onChange={handleChange} bg="bg-purple-50" />
              <CanvasBlock title="Entregáveis" field="entregaveis" data={data} isEditing={isEditing} onChange={handleChange} bg="bg-purple-50" />
            </div>
            <div className="flex flex-col gap-2">
              <CanvasBlock title="Cronograma" field="cronograma" data={data} isEditing={isEditing} onChange={handleChange} bg="bg-slate-100" />
              <CanvasBlock title="Orçamento" field="orcamento" data={data} isEditing={isEditing} onChange={handleChange} bg="bg-slate-100" />
            </div>
          </div>
        </div>
      );
    }

    function CanvasBlock({ title, field, data, isEditing, onChange, bg }) {
      return (
        <div className={`flex-1 flex flex-col p-3 rounded-md border border-gray-300 shadow-sm ${bg}`}>
          <h3 className="text-xs font-bold text-slate-700 uppercase tracking-wider mb-2 border-b border-gray-300 pb-1">{title}</h3>
          {isEditing ? (
            <textarea className="flex-1 w-full bg-white/50 border border-gray-200 rounded p-1 text-sm resize-none" value={data[field]} onChange={(e) => onChange(field, e.target.value)} />
          ) : (
            <div className="flex-1 text-sm text-slate-800 whitespace-pre-wrap">{data[field] || <span className="text-red-500 italic">Pendente</span>}</div>
          )}
        </div>
      );
    }

    function EapView({ text, setText, projectName }) {
      const [isEditing, setIsEditing] = useState(false);
      const treeData = useMemo(() => {
        const lines = text.split('\n').filter(l => l.trim() !== '');
        let currentNumbers = [];
        return lines.map((line, index) => {
          const match = line.match(/^(\s*)/);
          const indent = match ? match[1].length : 0;
          const cleanText = line.trim().replace(/^[\d.]+\s*/, '');
          let level = 0;
          if (index === 0) currentNumbers = [1];
          else {
            const prevIndent = lines[index - 1].match(/^(\s*)/)[1].length;
            if (indent > prevIndent) { level = currentNumbers.length; currentNumbers.push(1); }
            else if (indent < prevIndent) { level = Math.max(0, currentNumbers.length - 2); currentNumbers = currentNumbers.slice(0, level + 1); currentNumbers[level]++; }
            else { level = currentNumbers.length - 1; currentNumbers[level]++; }
          }
          return { id: currentNumbers.join('.'), label: cleanText, level };
        });
      }, [text]);

      return (
        <div className="max-w-5xl mx-auto flex flex-col h-full">
          <div className="flex justify-between items-center mb-6 no-print">
            <h2 className="text-2xl font-bold text-slate-800">Estrutura Analítica do Projeto</h2>
            <button onClick={() => setIsEditing(!isEditing)} className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium text-white ${isEditing ? 'bg-emerald-600' : 'bg-blue-600'}`}>
              {isEditing ? <><IconSave/> Gerar EAP</> : <><IconEdit/> Editar</>}
            </button>
          </div>
          {isEditing ? (
            <textarea className="flex-1 w-full border rounded-md p-4 font-mono text-sm resize-none" value={text} onChange={(e) => setText(e.target.value)} />
          ) : (
            <div className="flex-1 bg-white p-8 rounded-lg shadow-sm border overflow-auto">
              <div className="text-center mb-8 pb-4 border-b border-gray-200">
                <h2 className="text-xl font-bold text-slate-800">{projectName}</h2>
              </div>
              <div className="pl-4">
                {treeData.map((node) => (
                  <div key={node.id} className="flex items-center mb-2" style={{ marginLeft: `${node.level * 40}px` }}>
                    {node.level > 0 && <div className="w-6 h-px bg-gray-400 mr-2 border-t-2 border-dotted"></div>}
                    <div className={`px-4 py-2 rounded border ${node.level === 0 ? 'bg-blue-800 text-white font-bold text-lg' : node.level === 1 ? 'bg-blue-100 text-blue-900 font-semibold' : 'bg-white text-slate-700 text-sm'}`}>
                      <span className="opacity-70 mr-2 font-mono text-xs">{node.id}</span>{node.label}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    function GanttView({ tasks, setTasks }) {
      const [newTask, setNewTask] = useState({ name: '', start: '', end: '', status: 'pendente', resp: '' });
      const addTask = () => { if (newTask.name && newTask.start && newTask.end) { setTasks([...tasks, { ...newTask, id: Date.now() }]); setNewTask({ name: '', start: '', end: '', status: 'pendente', resp: '' }); } };
      const getDaysDiff = (start, end) => Math.ceil((new Date(end) - new Date(start)) / 86400000) + 1;
      let minDate = new Date(), maxDate = new Date();
      if (tasks.length > 0) {
        minDate = new Date(Math.min(...tasks.map(t => new Date(t.start))));
        maxDate = new Date(Math.max(...tasks.map(t => new Date(t.end))));
      }
      const totalProjectDays = Math.max(1, getDaysDiff(minDate, maxDate));

      return (
        <div className="max-w-full flex flex-col space-y-6">
          <h2 className="text-2xl font-bold text-slate-800 no-print">Cronograma e Gantt</h2>
          <div className="bg-white p-4 rounded-lg shadow-sm border flex flex-wrap gap-4 no-print items-end">
            <div className="flex-1 min-w-[200px]"><input type="text" className="w-full p-2 border rounded text-sm" placeholder="Atividade" value={newTask.name} onChange={e => setNewTask({...newTask, name: e.target.value})} /></div>
            <div><input type="text" className="w-32 p-2 border rounded text-sm" placeholder="Responsável" value={newTask.resp} onChange={e => setNewTask({...newTask, resp: e.target.value})} /></div>
            <div><input type="date" className="w-32 p-2 border rounded text-sm" value={newTask.start} onChange={e => setNewTask({...newTask, start: e.target.value})} /></div>
            <div><input type="date" className="w-32 p-2 border rounded text-sm" value={newTask.end} onChange={e => setNewTask({...newTask, end: e.target.value})} /></div>
            <button onClick={addTask} className="bg-blue-600 text-white px-4 py-2 rounded"><IconPlus/></button>
          </div>
          
          <div className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 bg-white p-6 rounded-lg shadow-sm border">
            <div className="lg:col-span-5 overflow-auto border-r pr-4">
              <table className="w-full text-left text-sm">
                <thead><tr className="border-b-2 bg-gray-50"><th className="p-2">Atividade</th><th className="p-2 no-print">Ação</th></tr></thead>
                <tbody>
                  {tasks.map(task => (
                    <tr key={task.id} className="border-b">
                      <td className="p-2">
                        <div className="font-medium">{task.name}</div>
                        <small className="text-gray-500">{task.start} - {task.end}</small>
                      </td>
                      <td className="p-2 no-print">
                        <select className="text-xs p-1 border rounded" value={task.status} onChange={e => setTasks(tasks.map(t => t.id === task.id ? { ...t, status: e.target.value } : t))}>
                          <option value="pendente">Pendente</option><option value="em_andamento">Andamento</option><option value="concluido">Concluído</option>
                        </select>
                        <button onClick={() => setTasks(tasks.filter(t => t.id !== task.id))} className="text-red-500 ml-2"><IconTrash/></button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            
            <div className="lg:col-span-7 overflow-x-auto">
              <div className="min-w-[500px]">
                <div className="flex justify-between text-xs font-bold text-gray-500 border-b pb-2 mb-2">
                  <span>{minDate.toLocaleDateString()}</span><span>{maxDate.toLocaleDateString()} ({totalProjectDays} dias)</span>
                </div>
                <div className="space-y-4 pt-2">
                  {tasks.map(task => {
                    const startOffsetDays = getDaysDiff(minDate, new Date(task.start)) - 1;
                    const durationDays = getDaysDiff(new Date(task.start), new Date(task.end));
                    const left = Math.max(0, (startOffsetDays / totalProjectDays) * 100);
                    const width = Math.min(100 - left, (durationDays / totalProjectDays) * 100);
                    return (
                      <div key={task.id} className="h-8 bg-gray-100 rounded relative">
                        <div className={`absolute h-6 rounded shadow-sm ${task.status==='concluido'?'bg-emerald-500':task.status==='em_andamento'?'bg-blue-500':'bg-slate-300'}`} style={{left:`${left}%`, width:`${width}%`, minWidth:'2px'}}></div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
